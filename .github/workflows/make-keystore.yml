name: Make Android keystore

# One-off helper. Android refuses to install an update signed by a different
# key, so the release keystore has to be created once and reused forever. This
# runs keytool on a runner (no local JDK needed), hands the resulting PKCS12
# back as an artifact, and the file is then stored as a repository secret.
#
# Delete this workflow once the keystore secret exists.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate PKCS12 keystore
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$PASS" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is unset"; exit 1; }
          keytool -genkeypair \
            -keystore readex.p12 -storetype PKCS12 \
            -alias readex -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Read-EX, OU=Read-EX, O=Read-EX, L=None, ST=None, C=CN"
          keytool -list -keystore readex.p12 -storepass "$PASS" | tail -5

      - uses: actions/upload-artifact@v4
        with:
          name: readex-keystore
          path: readex.p12
          retention-days: 1
