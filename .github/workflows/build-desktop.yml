name: Build Read-EX

# Builds Read-EX for Windows, macOS, Linux and Android, then attaches the
# installers to a draft release.
#
# Why the bundle formats are what they are (learned the hard way, see git log):
#
#   Windows  portable .zip, not NSIS. The NSIS bundler downloads its toolchain
#            from GitHub releases at package time and that fetch answers 504
#            from the runners - twice, eight minutes apart - and the build dies
#            after cargo has already finished. `--no-bundle` + a zip needs no
#            network at all and produces a working single-exe app.
#   Linux    .deb only, not AppImage. Same story: the AppImage bundler shells
#            out to quick-sharun, which downloads the runtime and fails.
#   macOS    .dmg works fine; nothing is fetched at package time.
#
# Triggers:
#   - push a v* tag            -> build, attach everything to a DRAFT release
#   - run from the Actions tab -> build only, files land as artifacts
#
# Works with zero secrets. TAURI_SIGNING_PRIVATE_KEY upgrades desktop builds to
# signed updater artifacts; APPLE_* are intentionally never passed as env (an
# empty APPLE_CERTIFICATE makes tauri run `security import` on nothing).

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true
      targets:
        description: 'Which platforms to build (comma separated: desktop,android)'
        type: string
        default: 'desktop,android'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.artifact }}
    # A tag always builds everything; a manual run can be narrowed with the
    # `targets` input so a change that only touches Android does not drag the
    # 45-minute desktop matrix along with it.
    if: github.event_name == 'push' || contains(inputs.targets, 'desktop')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: read-ex-windows-x64
            bundles: ''
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: read-ex-macos-universal
            # `app` is not redundant with `dmg`: only the `app` target emits the
            # signed .app.tar.gz the updater installs from. With `dmg` alone
            # tauri warns "configured to create updater artifacts but no
            # updater-enabled targets were built" and latest.json is never
            # produced, which silently kills auto-update.
            bundles: app,dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            artifact: read-ex-linux-x64
            bundles: deb
            target: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo records 8 git submodules but the import dropped their gitlinks,
      # so a plain checkout leaves pnpm and cargo with empty directories.
      - name: Restore submodules
        shell: bash
        run: bash scripts/bootstrap-submodules.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libsoup-3.0-dev \
            patchelf build-essential curl wget file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.artifact }}
          save-if: always

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile || {
            echo "::warning::lockfile drifted from the checked-out submodule trees; resolving instead."
            pnpm install --no-frozen-lockfile
          }

      - name: Stage vendored assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Configure build environment
        shell: bash
        working-directory: apps/readest-app
        run: |
          if [ -n "${{ vars.MICROSOFT_CLIENT_ID }}" ]; then
            echo "NEXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}" >> .env.tauri
            echo "OneDrive backend enabled."
          else
            echo "::warning::vars.MICROSOFT_CLIENT_ID is unset - the OneDrive row stays disabled. See FORK.md."
          fi

      # createUpdaterArtifacts lives in tauri.conf.json, but tauri hard-fails on
      # it when no signing key is available. Flip it off in-tree rather than
      # passing --config: tauri-action resolves --config against the repo root
      # while the tauri CLI resolves it against projectPath.
      - name: Guard updater artifacts
        shell: bash
        working-directory: apps/readest-app
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing key present - updater artifacts will be produced."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset - building installers without updater artifacts."

      - name: Build (Windows, portable)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target ${{ matrix.target }} --no-bundle
          mkdir -p ../../dist
          cp ../../target/${{ matrix.target }}/release/readest.exe ../../dist/Read-EX.exe
          # WebView2 is present on Win10 1803+ / Win11; note the requirement in
          # the readme shipped alongside the exe.
          cat > ../../dist/README.txt <<'EOF'
          Read-EX (portable)
          ==================
          1. Double-click Read-EX.exe.
          2. Requires the Microsoft Edge WebView2 runtime. Windows 10 (1803+) and
             Windows 11 ship it; if the app shows a blank window, install it from
             https://go.microsoft.com/fwlink/p/?LinkId=2124703

          No installer and no admin rights are needed. Delete the folder to
          uninstall. Your library lives in %APPDATA%\com.readex.app.
          EOF
          cd ../../dist
          # 7z is preinstalled on windows-latest; Compress-Archive is the backup
          # because zip layout does not matter for a portable app folder.
          if command -v 7z >/dev/null 2>&1; then
            7z a -bd read-ex-windows-x64.zip Read-EX.exe README.txt >/dev/null
          else
            powershell -NoProfile -Command "Compress-Archive -Path 'Read-EX.exe','README.txt' -DestinationPath 'read-ex-windows-x64.zip' -Force"
          fi
          ls -lh

      - name: Build (macOS, dmg)
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build (Linux, deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          # One glob set for all three: `**` covers the <triple>/ level that
          # appears whenever --target is passed, and empty patterns are simply
          # not matched.
          #
          # dist/*.exe matters: Windows has no NSIS/MSI here, so the bare exe is
          # the only thing the in-app updater can download and launch. The zip
          # stays as the friendly fresh-install package.
          path: |
            dist/*.zip
            dist/*.exe
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/deb/*.sig
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/macos/*.sig

  android:
    name: read-ex-android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: github.event_name == 'push' || contains(inputs.targets, 'android')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore submodules
        shell: bash
        run: bash scripts/bootstrap-submodules.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships a full Android SDK. setup-android first
      # tries to upgrade cmdline-tools and then hangs on
      # "Review licenses that have not been accepted (y/N)?" - with no stdin it
      # exits 1 and kills the job. Driving sdkmanager directly with `yes` skips
      # that dance entirely.
      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          # `yes` gets SIGPIPE once sdkmanager stops reading; do not let that fail
          # the step.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: read-ex-android
          save-if: always

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile || {
            echo "::warning::lockfile drifted; resolving instead."
            pnpm install --no-frozen-lockfile
          }

      - name: Stage vendored assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Configure build environment
        shell: bash
        working-directory: apps/readest-app
        run: |
          if [ -n "${{ vars.MICROSOFT_CLIENT_ID }}" ]; then
            echo "NEXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}" >> .env.tauri
          fi

      # Generates src-tauri/gen/android. Uses the identifier from
      # tauri.conf.json (com.readex.app) as the package name.
      - name: Init Android project
        working-directory: apps/readest-app
        run: pnpm tauri android init --ci

      # The release APK has to be signed, and Android refuses to install an
      # update signed by a different key, so the keystore is minted once and
      # kept in a repository secret from then on.
      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is unset - the release APK will be unsigned and cannot be installed."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d \
            > apps/readest-app/src-tauri/gen/android/app/readex.p12
          ls -l apps/readest-app/src-tauri/gen/android/app/readex.p12

      # Three fixes to the generated tree, all idempotent - see the script header
      # for why each is needed:
      #   - Gradle distribution -> Tencent mirror (services.gradle.org times out)
      #   - missingDimensionStrategy for the plugin's store/pen flavour dimensions
      #   - a signingConfigs block, without which assembleRelease is unsigned
      - name: Patch generated Android project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node scripts/patch-android-project.mjs

      # Release is the default variant: tauri only exposes `--debug` to opt the
      # other way, and passing `--release` is rejected as an unknown argument.
      # Rust's debug profile leaves libreadestlib.so unstripped and the resulting
      # APK was 659 MB; the release variant lets Gradle strip native libraries.
      # No --apk flag in tauri 2 either: APK output is the default. aarch64
      # covers every phone shipped in the last decade; armv7 can be added later.
      - name: Build APK
        working-directory: apps/readest-app
        run: pnpm tauri android build --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: read-ex-android
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            target/**/apk/**/*.apk

  release:
    name: Attach to release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      # download-artifact keeps the path each file had inside its artifact, so
      # staging/ ends up as staging/{apps,dist,target}/... and a plain
      # `files: staging/*` glob matches nothing at all. Collect the installers
      # into one flat directory first, renaming them to something a human can
      # recognise on the release page.
      - name: Flatten installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          V="${GITHUB_REF_NAME#v}"
          find staging -type f \
            \( -name '*.zip' -o -name '*.dmg' -o -name '*.deb' -o -name '*.apk' \
               -o -name '*.tar.gz' -o -name '*.sig' -o -name '*.exe' \) |
          while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *windows*.zip) cp "$f" "artifacts/Read-EX_${V}_windows-x64.zip" ;;
              *.exe)         cp "$f" "artifacts/Read-EX_${V}_windows-x64.exe" ;;
              *.apk)         cp "$f" "artifacts/Read-EX_${V}_android-arm64.apk" ;;
              *)             cp "$f" "artifacts/$base" ;;
            esac
          done
          ls -lh artifacts

          # A count check let a release through with four installers and no
          # updater artifact, i.e. everything looked green and auto-update was
          # dead on arrival. Name what has to be there instead.
          missing=0
          require() { [ -f "$1" ] || { echo "::error::missing $1"; missing=1; }; }
          require "artifacts/Read-EX_${V}_windows-x64.zip"
          require "artifacts/Read-EX_${V}_windows-x64.exe"
          require "artifacts/Read-EX_${V}_android-arm64.apk"
          ls artifacts/*.deb >/dev/null 2>&1 || { echo "::error::no .deb"; missing=1; }
          ls artifacts/*.dmg >/dev/null 2>&1 || { echo "::error::no .dmg"; missing=1; }
          # Without the signed tarball the tauri updater has nothing to install
          # on macOS and latest.json cannot be written at all.
          ls artifacts/*.app.tar.gz >/dev/null 2>&1 ||
            { echo "::error::no .app.tar.gz - macOS updater artifact missing"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      # The updater manifest used to come from tauri-action, which this workflow
      # no longer uses. Rebuild it from what is actually attached so
      # /releases/latest/download/latest.json always matches the release.
      - name: Write updater manifest
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = "artifacts";
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.GITHUB_REF_NAME}`;
            const files = fs.readdirSync(dir);
            const platforms = {};

            // macOS: the only platform tauri can replace in place here, so the
            // signature is real and both arches share the universal tarball.
            const sig = files.find((f) => f.endsWith(".app.tar.gz.sig"));
            if (sig) {
              const signature = fs.readFileSync(path.join(dir, sig), "utf8").trim();
              const asset = sig.replace(/\.sig$/, "");
              for (const key of ["darwin-x86_64", "darwin-aarch64"]) {
                platforms[key] = { signature, url: `${base}/${asset}` };
              }
            }

            // Windows ships a bare exe with no tauri signature (no NSIS/MSI
            // artifact exists on this fork). The app downloads and launches it
            // itself, which only needs the URL - hence the empty signature.
            const exe = files.find((f) => f.endsWith("_windows-x64.exe"));
            if (exe) platforms["windows-x86_64-portable"] = { signature: "", url: `${base}/${exe}` };

            const apk = files.find((f) => f.endsWith(".apk"));
            if (apk) platforms["android-arm64"] = { signature: "", url: `${base}/${apk}` };

            if (Object.keys(platforms).length === 0) {
              console.log("no updater artifacts - skipping latest.json");
              process.exit(0);
            }
            const manifest = {
              version: v,
              notes: `Read-EX ${v}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync(path.join(dir, "latest.json"), JSON.stringify(manifest, null, 2));
            console.log("latest.json platforms:", Object.keys(platforms).join(", "));
          '

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Published by default. This is not cosmetic: drafts are invisible to
          # /releases/latest/download/latest.json, so a draft release makes every
          # installed app report "up to date" forever.
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          name: Read-EX ${{ github.ref_name }}
          body: |
            Read-EX ${{ github.ref_name }} — Windows, macOS, Linux and Android.

            **Sync backends:** Readest Cloud (optional), WebDAV, S3, Google Drive, OneDrive, iCloud (Apple platforms) and **OpenList**.

            ### Install notes
            - **Windows** — unzip and run `Read-EX.exe`. No installer, no admin rights. Needs the Edge WebView2 runtime (preinstalled on Win10 1803+ / Win11).
            - **macOS** — open the `.dmg`, drag to Applications. Unsigned: run `xattr -dr com.apple.quarantine /Applications/Read-EX.app` or right-click → Open.
            - **Linux** — `sudo dpkg -i Read-EX_*_amd64.deb` (needs `libwebkit2gtk-4.1-0`). Debian/Ubuntu only for now: the AppImage bundler depends on a download that fails on GitHub runners.
            - **Android** — sideload the `.apk`. It is signed with a stable key, so later versions install over it; enable "install unknown apps" for your file manager.

            ### Updating
            Installed copies check this repository on every launch. Windows and Android download and hand over to the new build; macOS updates in place. Settings, library and sync configuration live outside the app bundle and survive the update. Auto-check can be turned off in Settings → Control → Update, and any single release can be skipped from the update dialog.

            Based on [readest](https://github.com/readest/readest), licensed **AGPL-3.0**. Source for this build: this repository.
          files: artifacts/*
          fail_on_unmatched_files: true
