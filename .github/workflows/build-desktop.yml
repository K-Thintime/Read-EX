name: Build Read-EX

# Builds Read-EX for Windows, macOS, Linux and Android, then attaches the
# installers to a draft release.
#
# Why the bundle formats are what they are (learned the hard way, see git log):
#
#   Windows  portable .zip, not NSIS. The NSIS bundler downloads its toolchain
#            from GitHub releases at package time and that fetch answers 504
#            from the runners - twice, eight minutes apart - and the build dies
#            after cargo has already finished. `--no-bundle` + a zip needs no
#            network at all and produces a working single-exe app.
#   Linux    .deb only, not AppImage. Same story: the AppImage bundler shells
#            out to quick-sharun, which downloads the runtime and fails.
#   macOS    .dmg works fine; nothing is fetched at package time.
#
# Triggers:
#   - push a v* tag            -> build, attach everything to a DRAFT release
#   - run from the Actions tab -> build only, files land as artifacts
#
# Works with zero secrets. TAURI_SIGNING_PRIVATE_KEY upgrades desktop builds to
# signed updater artifacts; APPLE_* are intentionally never passed as env (an
# empty APPLE_CERTIFICATE makes tauri run `security import` on nothing).

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: read-ex-windows-x64
            bundles: ''
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            artifact: read-ex-macos-universal
            bundles: dmg
            target: universal-apple-darwin
          - os: ubuntu-22.04
            artifact: read-ex-linux-x64
            bundles: deb
            target: ''

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The repo records 8 git submodules but the import dropped their gitlinks,
      # so a plain checkout leaves pnpm and cargo with empty directories.
      - name: Restore submodules
        shell: bash
        run: bash scripts/bootstrap-submodules.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libsoup-3.0-dev \
            patchelf build-essential curl wget file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.artifact }}
          save-if: always

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile || {
            echo "::warning::lockfile drifted from the checked-out submodule trees; resolving instead."
            pnpm install --no-frozen-lockfile
          }

      - name: Stage vendored assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Configure build environment
        shell: bash
        working-directory: apps/readest-app
        run: |
          if [ -n "${{ vars.MICROSOFT_CLIENT_ID }}" ]; then
            echo "NEXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}" >> .env.tauri
            echo "OneDrive backend enabled."
          else
            echo "::warning::vars.MICROSOFT_CLIENT_ID is unset - the OneDrive row stays disabled. See FORK.md."
          fi

      # createUpdaterArtifacts lives in tauri.conf.json, but tauri hard-fails on
      # it when no signing key is available. Flip it off in-tree rather than
      # passing --config: tauri-action resolves --config against the repo root
      # while the tauri CLI resolves it against projectPath.
      - name: Guard updater artifacts
        shell: bash
        working-directory: apps/readest-app
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing key present - updater artifacts will be produced."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset - building installers without updater artifacts."

      - name: Build (Windows, portable)
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target ${{ matrix.target }} --no-bundle
          mkdir -p ../../dist
          cp ../../target/${{ matrix.target }}/release/readest.exe ../../dist/Read-EX.exe
          # WebView2 is present on Win10 1803+ / Win11; note the requirement in
          # the readme shipped alongside the exe.
          cat > ../../dist/README.txt <<'EOF'
          Read-EX (portable)
          ==================
          1. Double-click Read-EX.exe.
          2. Requires the Microsoft Edge WebView2 runtime. Windows 10 (1803+) and
             Windows 11 ship it; if the app shows a blank window, install it from
             https://go.microsoft.com/fwlink/p/?LinkId=2124703

          No installer and no admin rights are needed. Delete the folder to
          uninstall. Your library lives in %APPDATA%\com.readex.app.
          EOF
          cd ../../dist
          # 7z is preinstalled on windows-latest; Compress-Archive is the backup
          # because zip layout does not matter for a portable app folder.
          if command -v 7z >/dev/null 2>&1; then
            7z a -bd read-ex-windows-x64.zip Read-EX.exe README.txt >/dev/null
          else
            powershell -NoProfile -Command "Compress-Archive -Path 'Read-EX.exe','README.txt' -DestinationPath 'read-ex-windows-x64.zip' -Force"
          fi
          ls -lh

      - name: Build (macOS, dmg)
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build (Linux, deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        working-directory: apps/readest-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          # One glob set for all three: `**` covers the <triple>/ level that
          # appears whenever --target is passed, and empty patterns are simply
          # not matched.
          path: |
            dist/*.zip
            target/**/bundle/dmg/*.dmg
            target/**/bundle/deb/*.deb
            target/**/bundle/deb/*.sig

  android:
    name: read-ex-android
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore submodules
        shell: bash
        run: bash scripts/bootstrap-submodules.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships a full Android SDK. setup-android first
      # tries to upgrade cmdline-tools and then hangs on
      # "Review licenses that have not been accepted (y/N)?" - with no stdin it
      # exits 1 and kills the job. Driving sdkmanager directly with `yes` skips
      # that dance entirely.
      - name: Set up Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          # `yes` gets SIGPIPE once sdkmanager stops reading; do not let that fail
          # the step.
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_PATH=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: read-ex-android
          save-if: always

      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile || {
            echo "::warning::lockfile drifted; resolving instead."
            pnpm install --no-frozen-lockfile
          }

      - name: Stage vendored assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Configure build environment
        shell: bash
        working-directory: apps/readest-app
        run: |
          if [ -n "${{ vars.MICROSOFT_CLIENT_ID }}" ]; then
            echo "NEXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}" >> .env.tauri
          fi

      # Generates src-tauri/gen/android. Uses the identifier from
      # tauri.conf.json (com.readex.app) as the package name.
      - name: Init Android project
        working-directory: apps/readest-app
        run: pnpm tauri android init --ci

      # The wrapper downloads its own Gradle distribution on first run and
      # services.gradle.org times out from the runners:
      #   Downloading gradle-8.14.3-bin.zip failed: java.net.SocketTimeoutException
      # The Tencent mirror serves the identical artefact and answers 200, so
      # rewrite the URL inside the generated wrapper properties.
      - name: Point Gradle wrapper at a reachable mirror
        working-directory: apps/readest-app
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/services\.gradle\.org\/distributions/g, 'mirrors.cloud.tencent.com/gradle');
            fs.writeFileSync(p, s);
            console.log(s.split('\n').find(l => l.startsWith('distributionUrl')));
          "

      # --debug: the release variant demands a signing config that only exists
      # once real distribution keys do. A debug-signed APK installs and runs the
      # production frontend bundle, which is what matters for a first release.
      # No --apk flag in tauri 2: APK output is the default. aarch64 covers
      # every phone shipped in the last decade; armv7 can be added later.
      - name: Build APK
        working-directory: apps/readest-app
        run: pnpm tauri android build --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: read-ex-android
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/readest-app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            target/**/apk/**/*.apk

  release:
    name: Attach to release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected files
        run: ls -lh dist

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'push' && true || inputs.draft }}
          name: Read-EX ${{ github.ref_name }}
          body: |
            Read-EX ${{ github.ref_name }} — Windows, macOS, Linux and Android.

            **Sync backends:** Readest Cloud (optional), WebDAV, S3, Google Drive, OneDrive, iCloud (Apple platforms) and **OpenList**.

            ### Install notes
            - **Windows** — unzip and run `Read-EX.exe`. No installer, no admin rights. Needs the Edge WebView2 runtime (preinstalled on Win10 1803+ / Win11).
            - **macOS** — open the `.dmg`, drag to Applications. Unsigned: run `xattr -dr com.apple.quarantine /Applications/Read-EX.app` or right-click → Open.
            - **Linux** — `sudo dpkg -i read-ex_*.deb` (needs `libwebkit2gtk-4.1-0`). Debian/Ubuntu only for now: the AppImage bundler depends on a download that fails on GitHub runners.
            - **Android** — sideload the `.apk`. It is debug-signed, so enable "install unknown apps" for your file manager.

            Based on [readest](https://github.com/readest/readest), licensed **AGPL-3.0**. Source for this build: this repository.
          files: dist/*
          fail_on_unmatched_files: false
