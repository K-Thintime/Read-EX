name: Build Read-EX

# Packages Read-EX for Windows (NSIS), macOS (universal dmg) and Linux
# (AppImage + deb). Deliberately standalone: upstream's release.yml depends on
# Readest's own Sentry / PostHog / Supabase / Apple / Discord secrets, none of
# which exist in a fork.
#
# Triggers:
#   - push a v* tag        -> build + attach installers to a DRAFT release
#   - run from the Actions tab -> build only, installers land as artifacts
#
# Everything works with zero secrets. Optional secrets only upgrade the output:
#   TAURI_SIGNING_PRIVATE_KEY(+ _PASSWORD) -> signed updater artifacts (.sig)
#   APPLE_CERTIFICATE & co.                -> signed + notarised dmg. These are
#     deliberately NOT passed as env by default: an empty APPLE_CERTIFICATE still
#     makes tauri run `security import` against nothing, which fails the whole
#     macOS bundle. Add them to the env blocks only once the secrets exist.
#   vars.MICROSOFT_CLIENT_ID               -> enables the OneDrive backend

on:
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish the release as a draft'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: read-ex-windows-x64
            base-args: '--target x86_64-pc-windows-msvc --bundles nsis'
          - os: macos-latest
            artifact: read-ex-macos-universal
            base-args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            artifact: read-ex-linux-x64
            base-args: '--bundles appimage,deb'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # tauri-action needs the tag/commit history to resolve the release.
          fetch-depth: 0

      # The repo stores 8 git submodules (tauri fork, swift-rs, foliate-js,
      # tauri-plugin-turso, ...). A checkout without them leaves pnpm and cargo
      # with empty directories, so restore them from .gitmodules first.
      - name: Restore submodules
        shell: bash
        run: bash scripts/bootstrap-submodules.sh

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libasound2-dev libsoup-3.0-dev \
            patchelf build-essential curl wget file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Universal macOS binary = both architectures in one bundle.
      - name: Add macOS cross targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          # Root Cargo.toml owns the workspace, so the target dir is repo-root/target.
          workspaces: '. -> target'
          key: ${{ matrix.artifact }}
          # Save even when the job fails: a failed *bundle* still leaves a
          # complete cargo target dir, and reusing it is the difference between
          # an 11-minute retry and a 30-second one.
          save-if: always

      # --frozen-lockfile is the fast path; the fallback exists because the
      # submodule clones above are branch tips and can drift from the lockfile
      # that was committed upstream. A resolving install keeps the build alive
      # instead of failing on a dependency spec the fork cannot control.
      - name: Install JS dependencies
        run: |
          pnpm install --frozen-lockfile || {
            echo "::warning::lockfile drifted from the checked-out submodule trees; resolving instead."
            pnpm install --no-frozen-lockfile
          }

      # pdf.js worker / wasm / fonts are copied out of node_modules into
      # public/vendor; the Next export fails without them.
      - name: Stage vendored assets
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Configure build environment
        shell: bash
        working-directory: apps/readest-app
        run: |
          if [ -n "${{ vars.MICROSOFT_CLIENT_ID }}" ]; then
            echo "NEXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}" >> .env.tauri
            echo "OneDrive backend enabled."
          else
            echo "::warning::vars.MICROSOFT_CLIENT_ID is unset - the OneDrive row will be disabled in this build. See FORK.md."
          fi

      # createUpdaterArtifacts is on in tauri.conf.json (the updater chain needs
      # it), but `tauri build` hard-fails when it cannot find a signing key. Flip
      # it off in-tree for keyless builds instead of passing --config: tauri-action
      # resolves --config against the repo root while tauri resolves it against
      # projectPath, so any relative path fails one of the two.
      - name: Guard updater artifacts
        shell: bash
        working-directory: apps/readest-app
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "Signing key present - updater artifacts (.sig) will be produced."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is unset - building installers without updater artifacts."

      - name: Build and publish draft release
        id: bundle
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/readest-app
          tagName: ${{ github.ref_name }}
          releaseName: 'Read-EX ${{ github.ref_name }}'
          releaseBody: |
            Read-EX ${{ github.ref_name }} — desktop builds for Windows, macOS and Linux.

            **Sync backends:** Readest Cloud (optional), WebDAV, S3, Google Drive, OneDrive, iCloud (Apple platforms) and **OpenList**.

            ### Install notes
            - **Windows**: run the `.exe` installer. SmartScreen will warn about an unknown publisher — the build is unsigned.
            - **macOS**: open the `.dmg`, drag to Applications. Unsigned builds need `xattr -dr com.apple.quarantine /Applications/Read-EX.app`, or right-click → Open.
            - **Linux**: the `.AppImage` is portable (`chmod +x` then run); the `.deb` needs `libwebkit2gtk-4.1-0`.

            Based on [readest](https://github.com/readest/readest), licensed **AGPL-3.0**. Source for this build: this repository.
          releaseDraft: ${{ github.event_name == 'push' && true || inputs.draft }}
          prerelease: false
          args: ${{ matrix.base-args }}

      # Bundlers fetch their own helpers at package time — NSIS plugins on
      # Windows, quick-sharun on Linux — and those downloads intermittently
      # answer 504 from the runner. Cargo has already finished by then, so one
      # retry only redoes the cheap bundling step, not the 11-minute build.
      - name: Retry bundling once
        if: startsWith(github.ref, 'refs/tags/') && steps.bundle.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/readest-app
          tagName: ${{ github.ref_name }}
          releaseName: 'Read-EX ${{ github.ref_name }}'
          releaseBody: |
            Read-EX ${{ github.ref_name }} — desktop builds for Windows, macOS and Linux.

            **Sync backends:** Readest Cloud (optional), WebDAV, S3, Google Drive, OneDrive, iCloud (Apple platforms) and **OpenList**.

            ### Install notes
            - **Windows**: run the `.exe` installer. SmartScreen will warn about an unknown publisher — the build is unsigned.
            - **macOS**: open the `.dmg`, drag to Applications. Unsigned builds need `xattr -dr com.apple.quarantine /Applications/Read-EX.app`, or right-click → Open.
            - **Linux**: the `.AppImage` is portable (`chmod +x` then run); the `.deb` needs `libwebkit2gtk-4.1-0`.

            Based on [readest](https://github.com/readest/readest), licensed **AGPL-3.0**. Source for this build: this repository.
          releaseDraft: ${{ github.event_name == 'push' && true || inputs.draft }}
          prerelease: false
          args: ${{ matrix.base-args }}

      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/readest-app
          args: ${{ matrix.base-args }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          # `**` because the target dir moves under a <triple>/ subdir whenever
          # --target is passed.
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/msi/*.msi
            target/**/bundle/dmg/*.dmg
            target/**/bundle/macos/*.app
            target/**/bundle/appimage/*.AppImage
            target/**/bundle/deb/*.deb
